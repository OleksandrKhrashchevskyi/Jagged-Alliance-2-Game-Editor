<svg xmlns="http://www.w3.org/2000/svg" width="400" height="76" viewBox="0 0 400 76" role="img" aria-label="Open the screenshot slider, 9 screenshots">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd35c"/>
      <stop offset="1" stop-color="#ef8a1f"/>
    </linearGradient>
    <linearGradient id="s" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#b45a00" flood-opacity=".45"/>
    </filter>
    <clipPath id="c"><rect x="10" y="6" width="380" height="56" rx="28"/></clipPath>
  </defs>
  <style>
    .t{font:700 17px 'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:1.6px;fill:#1d1403}
    .n{font:700 15px 'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:.6px;fill:#ffd35c}
    .shine{animation:sw 3.6s ease-in-out infinite}
    @keyframes sw{0%,55%{transform:translateX(-140px)}100%{transform:translateX(420px)}}
    @media (prefers-reduced-motion:reduce){.shine{animation:none;opacity:0}}
  </style>
  <rect x="10" y="6" width="380" height="56" rx="28" fill="url(#g)" filter="url(#sh)"/>
  <rect x="11.5" y="7.5" width="377" height="53" rx="26.5" fill="none" stroke="#fff" stroke-opacity=".45"/>
  <g clip-path="url(#c)"><rect class="shine" x="0" y="0" width="90" height="76" fill="url(#s)" transform="skewX(-20)"/></g>
  <circle cx="40" cy="34" r="19" fill="#1d1403"/>
  <path d="M35 24.5v19l15.5-9.5z" fill="#ffd35c"/>
  <text class="t" x="72" y="40">SCREENSHOT SLIDER</text>
  <rect x="296" y="17" width="84" height="34" rx="17" fill="#1d1403"/>
  <text class="n" x="338.0" y="39.5" text-anchor="middle">9 shots</text>
</svg>
