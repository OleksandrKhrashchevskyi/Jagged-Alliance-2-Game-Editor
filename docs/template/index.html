const all = {};
let current = SECTIONS[0].id;
SECTIONS.forEach(s => {

$('nf').textContent = FEATS; $('ns').textContent = SHOTS;
if (window.Chart) {
  const ink = '#d7dccb', dim = '#8b9670';
  const value = { id: 'value', afterDatasetsDraw(c) {
    const x = c.ctx; x.save(); x.fillStyle = ink; x.font = '12px Consolas,Menlo,monospace'; x.textBaseline = 'middle';
    c.getDatasetMeta(0).data.forEach((b, i) => x.fillText(c.data.datasets[0].data[i], b.x + 6, b.y)); x.restore();
  } };
  const bars = (id, data, unit) => new Chart($(id), {
    type: 'bar', plugins: [value],
    data: { labels: SECTIONS.map(s => s.title), datasets: [{ data, backgroundColor: '#f2b632', hoverBackgroundColor: '#ffd066', borderRadius: 4, barThickness: 14 }] },
    options: {
      indexAxis: 'y', maintainAspectRatio: false, layout: { padding: { right: 30 } },
      onClick: (e, el) => el[0] && $(SECTIONS[el[0].index].id).scrollIntoView(),
      onHover: (e, el) => e.native.target.style.cursor = el[0] ? 'pointer' : '',
      plugins: { legend: { display: false }, tooltip: { displayColors: false, callbacks: { label: c => c.parsed.x + ' ' + unit } } },
      scales: { x: { beginAtZero: true, grid: { color: '#ffffff0f' }, border: { display: false }, ticks: { color: dim, precision: 0 } },
        y: { grid: { display: false }, border: { color: '#26302a' }, ticks: { color: ink, font: { size: innerWidth < 700 ? 10 : 12 } } } }
    }
  });
  bars('cf', SECTIONS.map(s => FEATURES[s.id] || 0), 'features');
  bars('cs', SECTIONS.map(s => s.shots.length), 'screenshots');
}
// Search: every caption of every section; Enter or a click opens the screenshot.
const INDEX = SECTIONS.flatMap(s => s.shots.map(([n, c], i) => ({ id: s.id, sec: s.title, n, c, i })));
const q = $('q'), hits = $('hits');
const find = () => {
  const w = q.value.trim().toLowerCase();
  const r = w ? INDEX.filter(x => (x.c + ' ' + x.sec).toLowerCase().includes(w)).slice(0, 12) : [];
  hits.hidden = !w;
  hits.innerHTML = r.length ? r.map((x, k) => `<button type="button" class="list-group-item list-group-item-action${k ? '' : ' act'}" data-id="${x.id}" data-i="${x.i}"><img src="${src(x.n)}" alt="" loading="lazy"><span>${esc(x.c)}<small>${esc(x.sec)}</small></span></button>`).join('')
    : '<div class="list-group-item">Nothing found</div>';
};
const pick = b => { if (!b) return; go(b.dataset.id, +b.dataset.i); q.value = ''; hits.hidden = true; q.blur(); };
q.addEventListener('input', find);
q.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') pick(hits.querySelector('button')); if (e.key === 'Escape') { q.value = ''; hits.hidden = true; } });
hits.addEventListener('click', e => pick(e.target.closest('button')));
addEventListener('click', e => { if (!e.target.closest('.find')) hits.hidden = true; });
addEventListener('keydown', e => { if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); } });
</script>
</body>
</html>
